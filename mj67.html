<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全屏随机动图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* 或 contain，根据需求 */
            display: block;
        }
    </style>
</head>
<body>
    <img id="fullscreen-gif" src="" alt="随机动图" referrerpolicy="no-referrer">

    <script>
        // ✏️ 修改为你的两个动图链接
        const links = [
            'https://img.remit.ee/api/file/CgACAgUAAyEGAASHRsPbAAEZyURqjMIy81Ah38fD1jczG_4-aUflpQACmSYAAg-uaVRovl1SmLDrZD0E.gif',
            'https://img.remit.ee/api/file/CgACAgUAAyEGAASHRsPbAAEZyUBqjMB2dhwuNFP7Zimu1xdaNqZU7gAClSYAAg-uaVSKFQHTNw6v3T0E.gif'
        ];

        const img = document.getElementById('fullscreen-gif');

        img.onload = function() {
            console.log('✅ GIF 加载成功，当前链接：', img.src);
        };

        img.onerror = function() {
            console.error('❌ GIF 加载失败，当前链接：', img.src);
            // 可以自动尝试另一个链接
        };

        // 随机选择一个链接并加载
        function loadRandomGif() {
            const randomIndex = Math.floor(Math.random() * links.length);
            img.src = links[randomIndex];
        }

        window.onload = loadRandomGif;
    </script>
</body>
</html>
