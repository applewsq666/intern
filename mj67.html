<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全屏随机动图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <!-- 关键：添加 referrerpolicy="no-referrer" 避免防盗链 403 -->
    <img id="fullscreen-gif" src="" alt="随机动图" referrerpolicy="no-referrer">

    <script>
        // ✏️ 在这里修改你的两个动图链接
        const links = [
            'https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif',
            'https://media.giphy.com/media/l0HlNaQ6gWfllcjDO/giphy.gif'
        ];

        window.onload = function () {
            const randomIndex = Math.floor(Math.random() * links.length);
            document.getElementById('fullscreen-gif').src = links[randomIndex];
        };
    </script>
</body>
</html>
